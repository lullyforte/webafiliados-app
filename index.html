<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WebAfiliados">
  <title>WebAfiliados</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .logo {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b35, #f7c59f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 40px; }
    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 1rem; color: #aaa; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
    input {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #ff6b35; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #ff6b35, #e55a25);
      border: none;
      border-radius: 10px;
      padding: 16px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      border: 1px solid #ff6b35;
      color: #ff6b35;
    }
    .btn-secondary {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      margin-top: 10px;
    }
    .status {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-top: 12px;
      display: none;
    }
    .status.ok { background: #1a3a1a; color: #4caf50; display: block; }
    .status.err { background: #3a1a1a; color: #f44336; display: block; }
    .status.info { background: #1a2a3a; color: #64b5f6; display: block; }
    .push-status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      background: #2a2a2a;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; }
    .dot.green { background: #4caf50; }
    .dot.yellow { background: #ff9800; }
    .dot.red { background: #f44336; }
    .push-text { font-size: 0.9rem; color: #ccc; }
    .affiliate-info {
      background: #2a2a2a;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #ccc;
    }
    .affiliate-info strong { color: #fff; display: block; margin-bottom: 4px; }
    .prompt-box {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #eee;
      margin-bottom: 16px;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .product-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .product-meta {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 16px;
    }
    .field-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    .field-label:first-child { margin-top: 0; }
    .thumb {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 16px;
      display: block;
    }
    .loading { text-align: center; color: #888; padding: 40px 0; }
  </style>
</head>
<body>

  <div class="logo">WebAfiliados</div>
  <div class="subtitle" id="pageSubtitle">Painel do Afiliado</div>

  <!-- LOGIN -->
  <div class="card" id="loginSection">
    <h2>Entrar</h2>
    <input type="email" id="emailInput" placeholder="Seu e-mail" autocomplete="email">
    <input type="password" id="passInput" placeholder="Sua senha" autocomplete="current-password">
    <button class="btn" id="loginBtn" onclick="doLogin()">Entrar</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <!-- DASHBOARD -->
  <div class="card" id="dashSection" style="display:none;">
    <h2>Minha Conta</h2>
    <div class="affiliate-info" id="affiliateInfo">Carregando...</div>
    <button class="btn btn-secondary" onclick="showUploadScreen()">📤 Vídeos Pendentes</button>
    <button class="btn btn-outline" onclick="doLogout()" style="margin-top:10px;">Sair</button>
  </div>

  <!-- PUSH NOTIFICATIONS -->
  <div class="card" id="pushSection" style="display:none;">
    <h2>Notificações Push</h2>
    <div class="push-status">
      <div class="dot" id="pushDot"></div>
      <div class="push-text" id="pushText">Verificando...</div>
    </div>
    <button class="btn" id="pushBtn" onclick="requestPush()">Ativar Notificações</button>
    <div class="status" id="pushStatus"></div>
  </div>

  <!-- TELA: PROMPT PRONTO (Push 1) -->
  <div class="card" id="promptSection" style="display:none;">
    <h2>🎬 Prompt do Vídeo</h2>
    <img id="promptProductImage" class="thumb" style="display:none;" alt="Foto do produto">
    <div class="prompt-box" id="promptText"></div>
    <button class="btn" id="copyPromptBtn" onclick="copyPrompt()">📋 Copiar Prompt</button>
    <button class="btn btn-secondary" onclick="openYoutubeCreate()">▶️ Abrir YouTube Create</button>
    <button class="btn btn-secondary" id="downloadImageBtn" onclick="downloadProductImage()" style="display:none; margin-top:10px;">🖼️ Baixar Foto do Produto</button>
    <div class="status" id="promptStatus"></div>
  </div>

  <!-- TELA: PACOTE / VÍDEO PRONTO (Push 2) -->
  <div class="card" id="packageSection" style="display:none;">
    <h2>📦 Pacote do Vídeo</h2>
    <div id="packageContent" class="loading">Carregando pacote...</div>
  </div>

  <!-- TELA: UPLOAD DE VÍDEO -->
  <div class="card" id="uploadSection" style="display:none;">
    <h2>⬆️ Enviar Vídeo</h2>
    <button class="btn btn-outline" onclick="showDash()" style="margin-bottom:16px;">← Voltar</button>
    <div id="uploadContent" class="loading">Carregando...</div>
  </div>

  <script>
    const API = 'https://webafiliados-backend-production.up.railway.app';
    let SESSION = null;

    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    function getSession() {
      const saved = localStorage.getItem('wa_session');
      if (!saved) return null;
      try { return JSON.parse(saved); } catch(e) { return null; }
    }

    function hideAllCards() {
      ['loginSection','dashSection','pushSection','promptSection','packageSection','uploadSection'].forEach(id => {
        document.getElementById(id).style.display = 'none';
      });
    }

    window.addEventListener('load', async () => {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
        } catch(e) {
          console.warn('SW erro:', e.message);
        }
      }

      SESSION = getSession();

      const params = new URLSearchParams(window.location.search);
      const view = params.get('view');

      if (view === 'prompt') {
        renderPromptView(params);
        return;
      }

      if (view === 'package') {
        renderPackageView(params);
        return;
      }

      if (view === 'upload') {
        if (SESSION) {
          showUploadScreen();
        } else {
          hideAllCards();
          document.getElementById('loginSection').style.display = 'block';
        }
        return;
      }

      // Fluxo padrão: login/dashboard
      if (SESSION) {
        showDash();
        checkPushStatus();
      }
    });

    // ===== TELA DE PROMPT (Push 1) =====
    function renderPromptView(params) {
      hideAllCards();
      document.getElementById('pageSubtitle').textContent = 'Vídeo pronto para gerar';
      document.getElementById('promptSection').style.display = 'block';
      const text = params.get('text') || '(prompt vazio)';
      document.getElementById('promptText').textContent = decodeURIComponent(text);
      window._currentPrompt = decodeURIComponent(text);

      const imageParam = params.get('image');
      const imageUrl = imageParam ? decodeURIComponent(imageParam) : '';
      window._currentProductImage = imageUrl;
      const imgEl = document.getElementById('promptProductImage');
      const btnEl = document.getElementById('downloadImageBtn');
      if (imageUrl) {
        imgEl.src = imageUrl;
        imgEl.style.display = 'block';
        btnEl.style.display = 'block';
      } else {
        imgEl.style.display = 'none';
        btnEl.style.display = 'none';
      }
    }

    function downloadProductImage() {
      const url = window._currentProductImage;
      if (!url) return;
      window.open(url, '_blank');
    }

    function copyPrompt() {
      const st = document.getElementById('promptStatus');
      navigator.clipboard.writeText(window._currentPrompt || '')
        .then(() => showStatus(st, '✅ Prompt copiado!', 'ok'))
        .catch(() => showStatus(st, '❌ Não foi possível copiar automaticamente. Selecione o texto manualmente.', 'err'));
    }

    function openYoutubeCreate() {
      window.open('https://www.youtube.com/create', '_blank');
    }

    // ===== TELA DE PACOTE (Push 2) =====
    async function renderPackageView(params) {
      hideAllCards();
      document.getElementById('pageSubtitle').textContent = 'Conferir e publicar';
      document.getElementById('packageSection').style.display = 'block';
      const content = document.getElementById('packageContent');
      const packageId = params.get('id');

      if (!SESSION) {
        content.innerHTML = '<div class="status err" style="display:block;">Faça login no app para ver este pacote.</div>';
        return;
      }
      if (!packageId) {
        content.innerHTML = '<div class="status err" style="display:block;">Pacote não identificado.</div>';
        return;
      }

      try {
        const res = await fetch(API + '/api/packaging/ready', {
          headers: { 'Authorization': 'Bearer ' + SESSION.token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao buscar pacote');

        const pkg = (data.packages || []).find(p => String(p.id) === String(packageId));
        if (!pkg) throw new Error('Pacote não encontrado na lista de prontos');

        window._currentPackageCaption = (pkg.caption || '') + '\n' + (pkg.hashtags || '');
        window._currentPackageLink = pkg.affiliate_link || '';

        content.innerHTML = `
          <div class="product-title">${escapeHtml(pkg.title || pkg.product_name || 'Produto')}</div>
          <div class="product-meta">R$ ${pkg.price || ''} • Status: ${escapeHtml(pkg.status)}</div>

          <div class="field-label">Legenda</div>
          <div class="prompt-box" style="max-height:100px;">${escapeHtml(pkg.caption || '—')}</div>

          <div class="field-label">Hashtags</div>
          <div class="prompt-box" style="max-height:80px;">${escapeHtml(pkg.hashtags || '—')}</div>

          <div class="field-label">Link de Afiliado</div>
          <div class="prompt-box" style="max-height:60px;">${escapeHtml(pkg.affiliate_link || '—')}</div>

          <button class="btn btn-secondary" onclick="copyPackageCaption()">📋 Copiar Legenda + Hashtags</button>
          <button class="btn btn-secondary" onclick="openProductOnShopee()" style="margin-top:10px;">🛍️ Favoritar na Shopee</button>
          <div class="status" id="copyPackageStatus"></div>

          <button class="btn" onclick="confirmPackage('${packageId}')" id="confirmBtn" style="margin-top:16px;">✅ Confirmar Publicação</button>
          <div class="status" id="confirmStatus"></div>
        `;
      } catch(e) {
        content.innerHTML = '<div class="status err" style="display:block;">❌ ' + escapeHtml(e.message) + '</div>';
      }
    }

    async function confirmPackage(packageId) {
      const btn = document.getElementById('confirmBtn');
      const st = document.getElementById('confirmStatus');
      btn.disabled = true;
      btn.textContent = 'Confirmando...';
      try {
        const res = await fetch(API + '/api/packaging/' + packageId + '/confirm', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + SESSION.token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao confirmar');
        showStatus(st, '✅ Publicação confirmada!', 'ok');
        btn.textContent = 'Confirmado ✓';
      } catch(e) {
        showStatus(st, '❌ ' + e.message, 'err');
        btn.disabled = false;
        btn.textContent = '✅ Confirmar Publicação';
      }
    }

    function copyPackageCaption() {
      const st = document.getElementById('copyPackageStatus');
      navigator.clipboard.writeText(window._currentPackageCaption || '')
        .then(() => showStatus(st, '✅ Legenda e hashtags copiadas!', 'ok'))
        .catch(() => showStatus(st, '❌ Não foi possível copiar. Selecione o texto manualmente.', 'err'));
    }

    function openProductOnShopee() {
      const link = window._currentPackageLink;
      if (!link) {
        const st = document.getElementById('copyPackageStatus');
        showStatus(st, '❌ Link de afiliado não disponível.', 'err');
        return;
      }
      window.open(link, '_blank');
    }

    // ===== TELA DE UPLOAD (devolver vídeo gerado) =====
    function showUploadScreen() {
      hideAllCards();
      document.getElementById('pageSubtitle').textContent = 'Vídeos pendentes';
      document.getElementById('uploadSection').style.display = 'block';
      renderPendingList(document.getElementById('uploadContent'));
    }

    async function renderPendingList(content) {
      content.innerHTML = '<div class="loading">Carregando vídeos pendentes...</div>';

      if (!SESSION) {
        content.innerHTML = '<div class="status err" style="display:block;">Faça login para ver os vídeos pendentes.</div>';
        return;
      }

      try {
        const res = await fetch(API + '/api/video/pending', {
          headers: { 'Authorization': 'Bearer ' + SESSION.token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao buscar pendentes');

        if (!data.videos || data.videos.length === 0) {
          content.innerHTML = '<div class="status info" style="display:block;">Nenhum vídeo pendente no momento. 🎉</div>';
          return;
        }

        content.innerHTML = data.videos.map(v => `
          <div class="prompt-box" style="cursor:pointer;" onclick="renderSingleUpload(${v.id})">
            <strong>${escapeHtml(v.title || v.product_name || ('Vídeo #' + v.id))}</strong>
          </div>
        `).join('');
      } catch(e) {
        content.innerHTML = '<div class="status err" style="display:block;">❌ ' + escapeHtml(e.message) + '</div>';
      }
    }

    function renderSingleUpload(videoId) {
      const content = document.getElementById('uploadContent');
      content.innerHTML = `
        <div class="field-label">Vídeo #${videoId}</div>
        <input type="file" id="videoFileInput" accept="video/mp4" style="margin-bottom:16px; color:#fff;">
        <button class="btn" id="uploadBtn" onclick="doUpload(${videoId})">📤 Enviar Vídeo</button>
        <button class="btn btn-secondary" onclick="showUploadScreen()" style="margin-top:8px;">← Ver outros pendentes</button>
        <div class="status" id="uploadStatus"></div>
      `;
    }

    async function doUpload(videoId) {
      const fileInput = document.getElementById('videoFileInput');
      const btn = document.getElementById('uploadBtn');
      const st = document.getElementById('uploadStatus');

      if (!fileInput.files || fileInput.files.length === 0) {
        showStatus(st, 'Selecione um arquivo MP4 primeiro.', 'err');
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      showStatus(st, 'Enviando vídeo, aguarde...', 'info');

      try {
        const formData = new FormData();
        formData.append('video', file);

        const res = await fetch(API + '/api/video/' + videoId + '/upload', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + SESSION.token },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao enviar vídeo');

        showStatus(st, '✅ Vídeo enviado com sucesso!', 'ok');
        btn.textContent = 'Enviado ✓';
      } catch(e) {
        showStatus(st, '❌ ' + e.message, 'err');
        btn.disabled = false;
        btn.textContent = '📤 Enviar Vídeo';
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ===== LOGIN / DASHBOARD (fluxo original) =====
    async function doLogin() {
      const email = document.getElementById('emailInput').value.trim();
      const pass  = document.getElementById('passInput').value;
      const btn   = document.getElementById('loginBtn');
      const st    = document.getElementById('loginStatus');
      if (!email || !pass) { showStatus(st, 'Preencha e-mail e senha.', 'err'); return; }
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      showStatus(st, 'Autenticando...', 'info');
      try {
        const res = await fetch(API + '/api/affiliates/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao entrar');
        SESSION = data;
        localStorage.setItem('wa_session', JSON.stringify(SESSION));
        showDash();
        checkPushStatus();
      } catch(e) {
        showStatus(st, e.message, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    function doLogout() {
      SESSION = null;
      localStorage.removeItem('wa_session');
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('dashSection').style.display = 'none';
      document.getElementById('pushSection').style.display = 'none';
    }

    function showDash() {
      hideAllCards();
      document.getElementById('pageSubtitle').textContent = 'Painel do Afiliado';
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashSection').style.display = 'block';
      document.getElementById('pushSection').style.display = 'block';
      const info = document.getElementById('affiliateInfo');
      info.innerHTML = '<strong>' + (SESSION.affiliate && SESSION.affiliate.name ? SESSION.affiliate.name : SESSION.name || 'Afiliado') + '</strong>' + (SESSION.affiliate && SESSION.affiliate.email ? SESSION.affiliate.email : SESSION.email || '');
    }

    async function checkPushStatus() {
      const dot  = document.getElementById('pushDot');
      const text = document.getElementById('pushText');
      const btn  = document.getElementById('pushBtn');
      if (!('PushManager' in window)) {
        dot.className = 'dot red';
        text.textContent = 'Push não suportado — instale como app';
        btn.style.display = 'none';
        return;
      }
      const perm = Notification.permission;
      if (perm === 'granted') {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) {
          dot.className = 'dot green';
          text.textContent = 'Notificações ativas ✓';
          btn.textContent = 'Reativar';
          return;
        }
      }
      if (perm === 'denied') {
        dot.className = 'dot red';
        text.textContent = 'Bloqueado — libere nas configurações';
        btn.style.display = 'none';
        return;
      }
      dot.className = 'dot yellow';
      text.textContent = 'Notificações não ativadas';
    }

    async function requestPush() {
      const btn = document.getElementById('pushBtn');
      const st  = document.getElementById('pushStatus');
      if (!SESSION) { showStatus(st, 'Faça login primeiro.', 'err'); return; }
      btn.disabled = true;
      btn.textContent = 'Ativando...';
      try {
        const keyRes = await fetch(API + '/api/push/vapid-key');
        const keyData = await keyRes.json();
        const publicKey = keyData.publicKey;

        const reg  = await navigator.serviceWorker.ready;
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') throw new Error('Permissão negada');

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8Array(publicKey)
        });

        const affiliateId = SESSION.affiliate ? SESSION.affiliate.id : SESSION.id;
        const token = SESSION.token;

        const saveRes = await fetch(API + '/api/push/subscribe', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ affiliateId, subscription: sub.toJSON() })
        });

        if (!saveRes.ok) {
          const errData = await saveRes.json();
          throw new Error(errData.error || 'Erro ao salvar');
        }

        showStatus(st, '✅ Notificações ativadas!', 'ok');
        checkPushStatus();
      } catch(e) {
        showStatus(st, '❌ ' + e.message, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ativar Notificações';
      }
    }

    function showStatus(el, msg, type) {
      el.textContent = msg;
      el.className = 'status ' + type;
    }
  </script>
</body>
</html>
